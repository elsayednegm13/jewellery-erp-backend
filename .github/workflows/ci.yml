name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax-check all server source files
        run: find src scripts -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
